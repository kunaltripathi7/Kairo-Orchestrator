global:
  resolve_timeout: 5m

route:
  receiver: 'trelix-webhook'
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h

receivers:
  - name: 'trelix-webhook'
    webhook_configs:
      - url: 'http://host.docker.internal:8080/api/v1/webhooks/incoming'
        send_resolved: true
        http_config:
          headers:
            X-Webhook-Secret: '3e7fc42c72c3c95683ba20fd0f644af97c7d6290883a5d88'
